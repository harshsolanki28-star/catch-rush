<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="220" height="100">
  <defs>
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55" />
      <stop offset="50%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff2d55" />
    </linearGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a202c" />
      <stop offset="50%" stop-color="#18131d" />
      <stop offset="100%" stop-color="#0e0a12" />
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#f59f00" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Shadow -->
  <ellipse cx="110" cy="88" rx="85" ry="10" fill="rgba(0,0,0,0.5)" filter="blur(4px)" />

  <!-- Outer Metallic Hull -->
  <path d="M 15 28 C 30 78, 65 90, 110 90 C 155 90, 190 78, 205 28 C 175 42, 145 48, 110 48 C 75 48, 45 42, 15 28 Z" 
        fill="url(#metalBody)" stroke="#3d2f44" stroke-width="2" />

  <!-- Inner Catch Basin Grid -->
  <path d="M 28 35 C 50 68, 80 82, 110 82 C 140 82, 170 68, 192 35 C 165 44, 138 48, 110 48 C 82 48, 55 44, 28 35 Z" 
        fill="#120c18" stroke="rgba(255, 45, 85, 0.25)" stroke-width="1.5" />

  <!-- Neon Glowing Top Rim -->
  <path d="M 12 26 C 50 44, 85 48, 110 48 C 135 48, 170 44, 208 26 C 175 38, 140 42, 110 42 C 80 42, 45 38, 12 26 Z" 
        fill="url(#neonRim)" filter="url(#neonGlow)" />

  <!-- Left & Right Sleek Wing Grips -->
  <path d="M 12 26 C 8 20, 14 14, 24 16 C 18 20, 16 24, 12 26 Z" fill="#ff2d55" filter="url(#neonGlow)" />
  <path d="M 208 26 C 212 20, 206 14, 196 16 C 202 20, 204 24, 208 26 Z" fill="#ff2d55" filter="url(#neonGlow)" />

  <!-- Center Heart Insignia -->
  <g transform="translate(110, 68) scale(0.9)">
    <path d="M 0 -8 C -7 -16, -16 -8, -16 0 C -16 9, -2 15, 0 17 C 2 15, 16 9, 16 0 C 16 -8, 7 -16, 0 -8 Z" 
          fill="url(#accentGold)" filter="url(#neonGlow)" />
  </g>
</svg>
