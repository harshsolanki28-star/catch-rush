<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="340" height="120">
  <defs>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1624" />
      <stop offset="50%" stop-color="#130e18" />
      <stop offset="100%" stop-color="#0b080f" />
    </linearGradient>
    <linearGradient id="roseBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff2d55" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Pill Container -->
  <rect x="8" y="10" width="324" height="100" rx="36" fill="url(#pillGrad)" stroke="url(#roseBorder)" stroke-width="2.5" filter="url(#softGlow)" />

  <!-- Heart Icon on Left -->
  <g transform="translate(48, 60) scale(1.4)">
    <path d="M 0 -8 C -7 -16, -16 -8, -16 0 C -16 9, -2 15, 0 17 C 2 15, 16 9, 16 0 C 16 -8, 7 -16, 0 -8 Z" 
          fill="#ff2d55" />
    <path d="M 0 -8 C -4 -12, -10 -6, -10 0 C -10 6, -2 11, 0 12 C 2 11, 10 6, 10 0 C 10 -6, 4 -12, 0 -8 Z" 
          fill="#ff6b8b" opacity="0.6" />
  </g>

  <!-- Typography: CRUSH RUSH -->
  <text x="86" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1.5">
    CRUSH
  </text>
  <text x="210" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ff2d55" letter-spacing="1.5">
    RUSH
  </text>

  <!-- Subtitle Pill -->
  <text x="180" y="86" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#fef08a" letter-spacing="3">
    REFLEX DATING ARENA
  </text>
</svg>
