<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sparkles around flag -->
  <circle cx="62" cy="18" r="2.5" fill="#a7f3d0" opacity="0.8" />
  <circle cx="20" cy="58" r="2" fill="#a7f3d0" opacity="0.6" />
  <circle cx="68" cy="46" r="1.5" fill="#6ee7b7" opacity="0.7" />

  <!-- Pole -->
  <line x1="28" y1="12" x2="28" y2="72" stroke="url(#poleGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="28" cy="12" r="3.5" fill="#fef08a" />
  <ellipse cx="28" cy="72" rx="6" ry="2.5" fill="rgba(0,0,0,0.4)" />

  <!-- Flag Cloth with Wavy Dynamics -->
  <path d="M 28 16 C 42 12, 54 22, 68 18 L 64 44 C 50 48, 38 38, 28 42 Z" 
        fill="url(#emeraldGrad)" filter="url(#emeraldGlow)" stroke="#6ee7b7" stroke-width="1.2" />

  <!-- Heart Icon on Flag -->
  <path d="M 45 28 C 42 24, 38 27, 38 30 C 38 33, 44 36, 45 37 C 46 36, 52 33, 52 30 C 52 27, 48 24, 45 28 Z" 
        fill="#ffffff" opacity="0.95" />
</svg>
