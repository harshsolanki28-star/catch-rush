<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Frost Ring -->
  <circle cx="40" cy="40" r="30" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

  <!-- Martini Glass Silhouette with Ice Heart -->
  <path d="M 22 22 L 58 22 L 40 44 L 40 60 L 52 64 L 52 66 L 28 66 L 28 64 L 40 60 L 40 44 Z" 
        fill="url(#frostGrad)" filter="url(#iceGlow)" stroke="#f0f9ff" stroke-width="1.2" />

  <!-- Chilled Heart Garnish -->
  <path d="M 40 28 C 38 24, 34 26, 34 29 C 34 32, 39 35, 40 36 C 41 35, 46 32, 46 29 C 46 26, 42 24, 40 28 Z" 
        fill="#ffffff" />
  
  <circle cx="20" cy="20" r="2" fill="#bae6fd" />
  <circle cx="62" cy="22" r="1.5" fill="#bae6fd" />
  <circle cx="24" cy="52" r="2" fill="#7dd3fc" />
</svg>
