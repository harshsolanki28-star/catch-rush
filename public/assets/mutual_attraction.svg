<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Electric Ring -->
  <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Lightning Bolt -->
  <polygon points="42,12 24,40 38,40 32,68 56,34 42,34" 
           fill="url(#electricGrad)" filter="url(#goldGlow)" stroke="#fffbeb" stroke-width="1.5" />

  <!-- Twin Sparks -->
  <circle cx="20" cy="24" r="2.5" fill="#fef08a" />
  <circle cx="60" cy="56" r="2.5" fill="#fef08a" />
</svg>
