<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c" />
      <stop offset="60%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="darkPole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="rubyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Danger Embers -->
  <circle cx="64" cy="20" r="2.5" fill="#fecdd3" opacity="0.8" />
  <circle cx="18" cy="56" r="2" fill="#fb7185" opacity="0.6" />
  <circle cx="68" cy="48" r="1.5" fill="#f43f5e" opacity="0.7" />

  <!-- Pole -->
  <line x1="28" y1="12" x2="28" y2="72" stroke="url(#darkPole)" stroke-width="4" stroke-linecap="round" />
  <circle cx="28" cy="12" r="3.5" fill="#cbd5e1" />
  <ellipse cx="28" cy="72" rx="6" ry="2.5" fill="rgba(0,0,0,0.4)" />

  <!-- Flag Cloth with Sharp Warning Waves -->
  <path d="M 28 16 C 44 11, 56 24, 70 18 L 65 46 C 52 50, 40 38, 28 44 Z" 
        fill="url(#rubyGrad)" filter="url(#rubyGlow)" stroke="#fda4af" stroke-width="1.2" />

  <!-- Warning Broken Heart / Skull Mark -->
  <g transform="translate(46, 31) scale(0.65)">
    <path d="M 0 -8 C -7 -16, -16 -8, -16 0 C -16 9, -2 15, 0 17 C 2 15, 16 9, 16 0 C 16 -8, 7 -16, 0 -8 Z" fill="#ffffff" opacity="0.9" />
    <path d="M -2 -7 L 2 -1 L -3 5 L 3 11" stroke="#e11d48" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>
</svg>
